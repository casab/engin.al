# Build, check and deploy engin.al to Cloudflare (assets-only Worker, via the `cf` CLI).
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   token with "Workers Scripts: Edit" (+ "Workers Routes: Edit" / zone DNS once the domain is attached)
#   CLOUDFLARE_ACCOUNT_ID
#
# push to main        → production
# pull request (this repo) → Worker Preview URL
# pull request (fork)  → build + check only, no secrets
name: deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: main
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

concurrency:
  group: deploy-${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || '' }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache optimised images
        uses: actions/cache@v4
        with:
          path: .cache
          key: eleventy-img-${{ hashFiles('src/**/*.jpg', 'src/**/*.jpeg', 'src/**/*.png', 'src/**/*.webp') }}
          restore-keys: eleventy-img-

      - name: Install (exact versions from package-lock.json)
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build

      - name: Check output (links, alt text, CSP-safe markup, no demo data)
        run: npm run check
        env:
          CI: "1"

      - name: Deploy to production
        if: ${{ github.event_name != 'pull_request' }}
        run: npx cf deploy _site --message "${{ github.sha }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy preview
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        run: npx cf previews deploy _site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
